<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxx Design Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f10;
      color: #f5f5f5;
      padding: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .design-card {
      background: #18181a;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.25s ease;
    }

    .design-card:hover {
      transform: translateY(-6px);
    }

    .design-image {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .design-info {
      padding: 16px;
    }

    .design-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .design-category {
      font-size: 13px;
      color: #8a8a8f;
    }
  

    .cursor {
      width: 10px;
      height: 10px;
      background: #c9a96e;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    .cursor-ring {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(201,169,110,0.5);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <div class="gallery">

    <!-- COPY THIS CARD TO ADD NEW DESIGNS -->
    <div class="design-card">
      <img src="/thecarrabianlad/assets/img1.jpg" alt="Design" class="design-image">
      <div class="design-info">
        <div class="design-title">Poster Design</div>
        <div class="design-category">Branding</div>
      </div>
    </div>

    <div class="design-card">
      <img src="/thecarrabianlad/assets/img2.jpg" alt="Design" class="design-image">
      <div class="design-info">
        <div class="design-title">Social Media Design</div>
        <div class="design-category">Marketing</div>
      </div>
    </div>

    <div class="design-card">
      <img src="/thecarrabianlad/assets/img3.jpg" alt="Design" class="design-image">
      <div class="design-info">
        <div class="design-title">Album Cover</div>
        <div class="design-category">Creative</div>
      </div>
    </div>

  </div>

<script>
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX;
  my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';
});

function animateRing() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  cursorRing.style.left = rx + 'px';
  cursorRing.style.top = ry + 'px';
  requestAnimationFrame(animateRing);
}
animateRing();
</script>
</body>
</html>
